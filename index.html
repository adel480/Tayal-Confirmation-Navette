<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation Navette TAYAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 35px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; width: 100%; max-width: 400px; border-top: 5px solid #003366; }
        h2 { color: #003366; margin-top: 0; margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 25px; }
        .choix-badge { background: #FF9800; color: white; padding: 8px 20px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 25px; font-size: 16px; }
        input { width: 90%; padding: 14px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; outline: none; }
        input:focus { border-color: #003366; }
        button { background: #003366; color: white; border: none; padding: 14px 25px; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #002244; }
        #success-msg { color: #4CAF50; font-weight: bold; display: none; margin-top: 20px; font-size: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>TAYAL MGX</h2>
    <p class="subtitle">Département des Services Généraux</p>
    
    <p style="margin-bottom: 10px; color: #555;">Vous avez sélectionné :</p>
    <div class="choix-badge" id="display-choix">...</div>
    
    <p style="text-align: left; margin-bottom: 10px; font-size: 14px; color: #555; padding-left: 5%;">Veuillez confirmer votre Email :</p>
    <input type="email" id="email-input" placeholder="exemple: nom.prenom@tayal.dz" required>
    
    <button id="btn-submit" onclick="envoyerReponse()">Confirmer ma navette</button>
    
    <p id="success-msg">✅ Réservation confirmée avec succès !<br><br><span style="font-size: 13px; color: #888;">Vos données ont été transmises au département MGX. Vous pouvez fermer cette page.</span></p>
</div>

<script>
    // بيانات الاتصال الخاصة بك في Supabase
    const SUPABASE_URL = 'https://dsmflhnjmnllvhqkuepit.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzbWZsaG5qbW5sbHZoa3VlcGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMDkzNDksImV4cCI6MjEwODU4NTM0OX0.lZTNCcKa_GW22fIPNGvDyH-sJ-zIyUUySiBtLS7tDmM';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // استخراج الاختيار الذي ضغط عليه العامل من رابط الإيميل
    const urlParams = new URLSearchParams(window.location.search);
    const choixNavette = urlParams.get('choix') || 'Non spécifié';
    document.getElementById('display-choix').innerText = choixNavette.replace(/_/g, ' ');

    // وظيفة إرسال البيانات
    async function envoyerReponse() {
        const email = document.getElementById('email-input').value;
        const btn = document.getElementById('btn-submit');
        
        if (!email || !email.includes('@')) {
            alert("Veuillez entrer une adresse email valide.");
            return;
        }

        // تغيير شكل الزر أثناء الإرسال
        btn.disabled = true;
        btn.innerText = "Envoi en cours...";
        btn.style.opacity = "0.7";

        // الإرسال إلى جدول Supabase
        const { data, error } = await supabase
            .from('navette_reponses')
            .insert([
                { email_employe: email, choix: choixNavette }
            ]);

        if (error) {
            alert("Erreur de connexion : " + error.message);
            btn.disabled = false;
            btn.innerText = "Confirmer ma navette";
            btn.style.opacity = "1";
        } else {
            // إخفاء الحقول وإظهار رسالة النجاح
            document.getElementById('success-msg').style.display = 'block';
            document.getElementById('email-input').style.display = 'none';
            btn.style.display = 'none';
            // إخفاء النص الإرشادي
            document.querySelectorAll('p')[2].style.display = 'none';
        }
    }
</script>

</body>
</html>
